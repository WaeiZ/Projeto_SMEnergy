    esphome/AsyncTCP-esphome @ ^2.1.4
    mandulaj/PZEM-004T-v30 @ ^1.1.2
    mobizt/FirebaseClient
    adafruit/Adafruit SSD1306 @ ^2.5.9
    adafruit/Adafruit GFX Library @ ^1.11.9

